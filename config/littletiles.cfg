# Configuration file

little_bag {
    # How many different materials a single little bag can hold. Every material needs a slot of its own for the tiles that do not add up to a whole block, so this is what keeps the size of the bag in check. Has to be the same on the client and on the server. Lowering it keeps what bags hold already, a bag above the limit only refuses new materials until enough were taken out. [range: 1 ~ 10000, default: 200]
    I:maxMaterials=200
}


